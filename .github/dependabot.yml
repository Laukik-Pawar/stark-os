# Monthly, grouped dependency updates: at most one pull request per ecosystem per month.
# Security fixes still arrive as soon as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      web-dependencies: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /services/api
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      api-dependencies: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
